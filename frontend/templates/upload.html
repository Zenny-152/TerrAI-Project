<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TerrAI — Envio de imagem</title>
  <style>
    :root{--accent:#2c9f8a;--bg:#fbfbfc;--card:#ffffff;--muted:#666}
    body{font-family:Inter, Arial, Helvetica, sans-serif;background:var(--bg);margin:0;padding:24px;color:#222}
    .wrap{max-width:900px;margin:0 auto}
    header{display:flex;align-items:center;gap:12px}
    h1{font-size:20px;margin:0}
    .card{background:var(--card);border-radius:8px;padding:18px;margin-top:18px;box-shadow:0 6px 18px rgba(20,20,40,0.05)}
    label{display:block;margin:10px 0 6px;font-weight:600}
    input[type=text], input[type=file]{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:6px}
    .row{display:flex;gap:12px}
    .row > *{flex:1}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .preview{margin-top:12px;border-radius:6px;overflow:hidden;border:1px solid #eee}
    .preview img{width:100%;display:block}
    pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}
    .result{display:grid;grid-template-columns:1fr 220px;gap:12px}
    .stat{background:#fff;padding:12px;border-radius:8px}
    .label{font-size:12px;color:var(--muted)}
    .big{font-weight:700;font-size:18px}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#f2f7f5;color:#064; font-weight:700}
    .maplink{display:inline-block;margin-top:8px;color:var(--accent)}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>TerrAI — Envio de imagem</h1>
    </header>

    <div class="card">
      <form id="form" enctype="multipart/form-data">
        <label for="file">Selecione a imagem (jpg/png)</label>
        <input id="file" name="file" type="file" accept="image/*" required />

        <div class="row" style="margin-top:8px">
          <div>
            <label for="lat">Latitude (opcional)</label>
            <input id="lat" name="lat" type="text" placeholder="-22.915" />
          </div>
          <div>
            <label for="lon">Longitude (opcional)</label>
            <input id="lon" name="lon" type="text" placeholder="-43.200" />
          </div>
        </div>

        <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
          <button id="submit">Enviar e analisar</button>
          <div id="progress" style="font-size:13px;color:var(--muted)"></div>
        </div>

        <div class="preview" id="preview" style="display:none;margin-top:12px">
          <img id="previewImg" alt="preview" />
        </div>
      </form>

      <div id="out" style="margin-top:12px"></div>

      <footer>
        Dica: se a foto tiver geolocalização (EXIF) o sistema tentará usar; preencha lat/lon como fallback.
      </footer>
    </div>
  </div>

  <script>

    const INGEST_URL = '/ingest/upload';

    const form = document.getElementById('form');
    const fileInput = document.getElementById('file');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const out = document.getElementById('out');
    const progress = document.getElementById('progress');
    const submit = document.getElementById('submit');

    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) { preview.style.display='none'; return; }
      const url = URL.createObjectURL(f);
      previewImg.src = url; preview.style.display = 'block';
    });

    function fmtPercent(p){
      if (p === null || p === undefined) return '—';
      return (Math.round(p*100)/100).toFixed(2) + '%';
    }

    form.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      out.innerHTML = '';
      progress.textContent = 'Preparando envio...';
      submit.disabled = true;

      const fd = new FormData();
      if (!fileInput.files || !fileInput.files[0]) { out.textContent = 'Selecione um arquivo.'; submit.disabled=false; return; }
      fd.append('file', fileInput.files[0]);
      const lat = document.getElementById('lat').value;
      const lon = document.getElementById('lon').value;
      if (lat) fd.append('lat', lat);
      if (lon) fd.append('lon', lon);

      try {
        // usamos XHR para ter progresso
        await new Promise((resolve, reject)=>{
          const xhr = new XMLHttpRequest();
          xhr.open('POST', INGEST_URL, true);
          xhr.responseType = 'json';
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.response || {});
            else reject({status:xhr.status, text: xhr.responseText});
          };
          xhr.onerror = () => reject({status:'ERR', text:'Network error'});
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) progress.textContent = 'Enviando: ' + Math.round((e.loaded/e.total)*100) + '%';
            else progress.textContent = 'Enviando...';
          };
          xhr.send(fd);
        }).then((resp)=>{
          progress.textContent = 'Recebendo resultado...';
          renderResult(resp);
        }).catch(err=>{ throw err; });
      } catch (e){
        console.error(e);
        out.innerHTML = `<div style="color:#900">Erro: ${e && e.status ? 'status '+e.status : 'Falha no envio'}</div>`;
      } finally {
        submit.disabled = false;
        progress.textContent = '';
      }
    });

    function renderResult(resp){
      if (!resp) { out.innerHTML = '<div>Resposta vazia do servidor</div>'; return; }
      // se o servidor retornar objeto com message/erro
      if (resp.error){ out.innerHTML = `<div style="color:#900">Erro: ${resp.error}</div>`; return; }

      // Campos que o backend deve retornar: percentage, severity_label, prob, probs, model_version, lat/lon (quando disponíveis)
      const percent = resp.percentage ?? resp.percentage;
      const severity = resp.severity_label ?? resp.severity ?? 'unknown';
      const prob = resp.prob ?? null;
      const probs = resp.probs ?? null;
      const model = resp.model_version ?? null;

      // monta HTML
      let html = '';
      html += '<div class="result">';
      html += '<div class="stat">';
      html += `<div class="label">Nivel estimado</div>`;
      html += `<div class="big">${severity.toUpperCase()}</div>`;
      if (percent!==null && percent!==undefined) html += `<div style="margin-top:6px">Probabilidade combinada: <strong>${percent}</strong></div>`;
      if (prob!==null && prob!==undefined) html += `<div style="margin-top:6px">Probabilidade em porcentagem: <strong>${fmtPercent(prob)}</strong></div>`;
      if (model) html += `<div style="margin-top:8px;font-size:12px;color:var(--muted)">Modelo: ${model}</div>`;
      if (resp.lat!==undefined && resp.lon!==undefined) {
        html += `<div style="margin-top:8px"><span class="label">Coordenadas</span><div>${resp.lat}, ${resp.lon}</div>`;
        if (resp.prediction_polygon) html += `<div><a class="maplink" href="#" onclick="window.open(JSON.stringify(${JSON.stringify(resp.prediction_polygon)}))">Ver polígono</a></div>`;
        html += '</div>';
      }
      html += '</div>'; // stat

      html += '<div class="stat">';
      html += '<div class="label">Distribuição (todas as classes)</div>';
      if (Array.isArray(probs)){
        html += '<div style="margin-top:6px">';
        probs.forEach((p,i)=>{
          html += `<div style="margin:6px 0"><strong>${(p*100).toFixed(1)}%</strong> — Classe ${i+1}</div>`;
        });
        html += '</div>';
      } else html += '<div>N/D</div>';
      html += '</div>'; // stat

      html += '</div>'; // result

      out.innerHTML = html;
    }
  </script>
</body>
</html>
